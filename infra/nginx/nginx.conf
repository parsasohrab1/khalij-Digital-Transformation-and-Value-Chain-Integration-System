# TLS 1.3 reverse proxy + HA upstream for API Gateway (NFR-SEC-01 / NFR-AVAIL-01)
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream api_gateway_pool {
    least_conn;
    server api-gateway:8000 max_fails=3 fail_timeout=10s;
    server api-gateway-2:8000 max_fails=3 fail_timeout=10s backup;
    keepalive 64;
  }

  upstream command_center_pool {
    server command-center:8010 max_fails=3 fail_timeout=10s;
  }

  # redirect HTTP -> HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Force TLS 1.3 only
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-TLS-Min-Version "TLSv1.3" always;

    location / {
      proxy_pass http://command_center_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://api_gateway_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
    }

    location /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}
